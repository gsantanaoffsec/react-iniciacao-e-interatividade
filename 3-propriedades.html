<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div id="root"></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const buttonVariants = {
            default: 'bg-gray-500',
            primary: 'bg-purple-500'
        }

        // Criação dos componentes  

        function Button({ children, variant = 'default', className, ...props }) {
            return (
                <button 
                    className={`
                        px-3 py-2 rounded text-white
                        ${buttonVariants[variant]}
                        ${className}
                    `}
                    
                    /* Qualquer outra propriedade que não estiver definida, será passada pra frente */

                    {...props}
                    >

                    {/* Qualquer valor dinâmico, a ser renderizado no react, precisa estar entre chaves */}
                    {/* Motivo: entre as chaves o JavaScript será executado ! */}

                    {children}
                </button>
            )
        }

        function App() {
            return (
                <main className="flex gap-2 p-3">
                    <Button type="button" title="Nothin2SeeHereLoL" className="mr-15">
                        Botão
                    </Button>
                    <Button variant="primary"> 
                        Outro Botão
                    </Button>
                </main>
            )
        }


        ReactDOM.createRoot(document.getElementById('root')).render(
            <App />
        )

    </script>

</body>

</html>
