<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        function AlertI() {
            function handleAlertClick(event) {
                console.log(event)
                alert('Uma mensagem de alerta!')
            }

            return (
                <button type="button" onClick={handleAlertClick}>
                    Mostrar Alerta
                </button>
            )
        }

        function AlertII() {
            function handleAlertClick(message) {
                alert(message)
            }

            return (
                <button onClick={() => handleAlertClick('Uma mensagem de alerta via PARÂMETRO!')}>
                    Mostrar Alerta c/ Parâmetro
                </button>
            )
        }

        function AlertIII() {
            function handleAlertClick(event) {
                alert(event.target.previousSibling.value)
            }

            function handleInputChange(event) {
                console.log(event.target.value)
            }

            return (
                <div>
                    <input
                        type="text"
                        placeholder="Digite algo..."
                        onChange={handleInputChange}
                    />
                    <button onClick={handleAlertClick}>
                        Mostrar Alerta Do Campo de Texto
                    </button>
                </div >
            )
        }

        function App() {
            return (
                <main className="p-3">
                    <AlertI />
                    <AlertII />
                    <AlertIII />
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)

    </script>



</body>

</html>
